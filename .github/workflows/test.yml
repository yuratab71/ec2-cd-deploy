name: Test Application
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
        - '**'
jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup NodeJS
        uses: actions/setup-node@v7
      - name: Npm Install
        run: |
          npm install
      - name: Lint
        run: |
          npm run lint
      - name: Test
        run: |
          npm run test


