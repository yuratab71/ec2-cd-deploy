name: Build And Deploy
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup NodeJS
        uses: actions/setup-node@v7
      - name: Npm Install
        run: |
          npm install
      - name: Lint
        run: |
          npm run lint
      - name: Test
        run: |
          npm run test
  Build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Docker build
        run: |
          docker build --progress=plain -t ghostfolio .
      - name: Push Latest
        id: push_latest
        uses: jwalton/gh-ecr-push@v2
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ secrets.AWS_REGION }}
          local-image: ghostfolio
          image: ghostfolio:latest
      - name: Push Tag
        id: push_tag
        uses: jwalton/gh-ecr-push@v2
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ secrets.AWS_REGION }}
          local-image: ghostfolio
          image: ghostfolio:${{ github.ref_name }}
      - name: Push Tag
        id: push_hash
        uses: jwalton/gh-ecr-push@v2
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ secrets.AWS_REGION }}
          local-image: ghostfolio
          image: ghostfolio:${{ github.sha }}
  Draft_Release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{github.ref_name}}
          name: 'Release ${{github.ref_name}}'
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          body: |
            Test Draft Release
  Deploy:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Move docker compose file to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker/docker-compose.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}"





