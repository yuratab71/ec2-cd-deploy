name: Build And Deploy
on:
  workflow_run:
    workflows: ["Test Application"]
    types:
      - completed
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
  Test:
    uses: yuratab71/ec2-cd-deploy/.github/workflows/test.yml
  Build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Docker build
        run: |
          docker build --progress=plain -t ghostfolio .
      - name: Push Latest
        id: push_latest
        uses: jwalton/gh-ecr-push@v2
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ secrets.AWS_REGION }}
          local-image: ghostfolio
          image: ghostfolio:latest
      - name: Push Tag
        id: push_tag
        uses: jwalton/gh-ecr-push@v2
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ secrets.AWS_REGION }}
          local-image: ghostfolio
          image: ghostfolio:${{ github.ref_name }}
  Deploy:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Move docker compose file to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker/docker-compose.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}"





